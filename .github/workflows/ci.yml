name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Build and install from a regular (non-editable) wheel in a fresh venv,
      # then confirm the console script and Hermes plugin entry point resolve.
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/hermes-drive-index-wheel-venv
      - run: /tmp/hermes-drive-index-wheel-venv/bin/python -m pip install dist/*.whl
      - run: /tmp/hermes-drive-index-wheel-venv/bin/hermes-drive-index --version
      - run: |
          /tmp/hermes-drive-index-wheel-venv/bin/python -c "import importlib.metadata as m; \
            eps=[e for e in m.entry_points(group='hermes_agent.plugins') if e.name=='drive_index']; \
            assert eps, 'plugin entry point missing'; print(eps[0].load())"
