# Example config. Copy to your local Hermes drive index config path and edit.
# Do not commit real folder IDs or private paths.

root_folder_name = "Personal Files"
# root_folder_id = "your-google-drive-folder-id"
# base_dir = "/home/you/.hermes/drive_index/personal_files"
# db_path = "/home/you/.hermes/drive_index/personal_files/index.db"

# Optional OCR defaults to off. PDF OCR uses ocrmypdf; image OCR uses tesseract.
# Missing OCR tools are non-fatal and fall back to metadata-only indexing.
# ocr_enabled = false
# ocr_image_enabled = false
# Optional folder scoping (paths relative to the root folder). Empty = all.
# For image OCR, prefer include_folders = ["Scanned Docs"] to avoid personal photos.
# include_folders = []
# exclude_folders = ["Photos"]

# Optional Drive auto-organization defaults to off. When enabled, index runs
# can rename and move matching documents before indexing them. Start with
# dry_run = true and inspect update metrics before allowing Drive mutations.
# [auto_organize]
# enabled = false
# dry_run = true
# apply_to_existing = false
# default_target_folder_path = "Personal Files/Documents/Unsorted"
# rename_template = "{date} - {category} - {title}{ext}"
#
# [[auto_organize.rules]]
# name = "receipts"
# pattern = "receipt|invoice|tax invoice"
# target_folder_path = "Personal Files/Finance/Receipts"
# category = "Receipt"
