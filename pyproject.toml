[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-drive-index"
version = "0.1.0"
description = "Private local Google Drive full-text search index and Hermes Agent plugin powered by SQLite FTS5"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Hermes Agent"}]
keywords = [
  "hermes-agent",
  "google-drive",
  "google-drive-search",
  "sqlite-fts5",
  "local-search",
  "document-search",
  "rag",
  "ai-agent",
  "private-search",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "pypdf>=4",
  "python-docx>=1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
hermes-drive-index = "hermes_drive_index.cli:main"

[project.entry-points."hermes_agent.plugins"]
drive_index = "hermes_drive_index.hermes_adapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
